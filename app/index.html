<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>TODO Light</title>
<style>
  :root {
    --op: 0.82;
    --accent: #7ee0ff;
    --accent2: #b28bff;
    --pred: #ffd36e;
    --succ: #8bffb2;
    --text: #eaf4ff;
    --muted: rgba(234, 244, 255, 0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: transparent;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    overflow: hidden;
  }
  .frame { height: 100%; padding: 10px; }
  .panel {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(126, 224, 255, 0.16), transparent 55%),
      radial-gradient(100% 80% at 100% 100%, rgba(178, 139, 255, 0.18), transparent 60%),
      linear-gradient(160deg, rgba(22, 28, 46, calc(var(--op) * 0.92)), rgba(10, 12, 24, var(--op)));
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 0 40px rgba(126, 224, 255, 0.04);
    overflow: hidden;
  }

  /* Windows 11 ネイティブすりガラス: ウィンドウ自体がぼける。CSSは薄い色味だけ重ねる */
  html.native .frame { padding: 0; }
  html.native .panel {
    border-radius: 0;
    border: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(126, 224, 255, 0.10), transparent 55%),
      radial-gradient(100% 80% at 100% 100%, rgba(178, 139, 255, 0.12), transparent 60%),
      linear-gradient(160deg, rgba(22, 28, 46, calc(var(--op) * 0.45)), rgba(10, 12, 24, calc(var(--op) * 0.55)));
  }

  header {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 16px 16px 8px;
  }
  .title { flex: 1; }
  .title h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.12em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title h1 span { font-weight: 300; letter-spacing: 0.06em; }
  .title .sub { display: none; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .hbtn {
    -webkit-app-region: no-drag;
    width: 24px; height: 26px;
    border: none; border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
  }
  .hbtn { display: grid; place-items: center; padding: 0; }
  .hbtn svg { display: block; }
  .hbtn:hover { background: rgba(255,255,255,0.16); color: var(--text); }
  .hbtn.on { background: rgba(126,224,255,0.18); color: var(--accent); }

  /* ---------- 配置・サイズのポップオーバー ---------- */
  .pop {
    -webkit-app-region: no-drag;
    position: absolute; top: 60px; right: 12px; z-index: 20;
    width: 208px; padding: 10px 12px 12px;
    border-radius: 16px;
    background: rgba(14, 18, 34, 0.95);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 14px 34px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
    transform-origin: 100% 0;
    animation: pop-in .16s ease-out;
  }
  .pop[hidden] { display: none; }
  @keyframes pop-in { from { opacity: 0; transform: scale(.94) translateY(-4px); } }
  .pop-h {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: var(--muted); margin-bottom: 8px;
  }
  .pop-h b { color: var(--text); font-size: 12px; letter-spacing: .08em; }

  kbd {
    font: 600 10px/1 "Segoe UI", system-ui, sans-serif;
    padding: 2px 5px; border-radius: 5px;
    background: rgba(255,255,255,0.1); color: var(--muted);
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }

  /* ミニ画面: 現在のウィンドウ位置を縮小表示し、隅をクリックで瞬間移動 */
  .mini-wrap { position: relative; padding: 7px; }
  .mini {
    position: relative; width: 100%; aspect-ratio: 16 / 10;
    border-radius: 7px; overflow: hidden;
    background:
      radial-gradient(120% 90% at 20% 0%, rgba(126,224,255,0.14), transparent 60%),
      linear-gradient(160deg, #1b2440, #0d1224);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
  }
  .q {
    position: absolute; width: 50%; height: 50%;
    border: none; background: transparent; cursor: pointer;
    transition: background .12s;
  }
  .q.tl { top: 0; left: 0; } .q.tr { top: 0; right: 0; }
  .q.bl { bottom: 0; left: 0; } .q.br { bottom: 0; right: 0; }
  .q:hover { background: rgba(126,224,255,0.10); }
  .ghost, .ghost-pre {
    position: absolute; pointer-events: none; border-radius: 3px;
    transition: left .28s cubic-bezier(.2,.8,.2,1), top .28s cubic-bezier(.2,.8,.2,1),
                width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1);
  }
  .ghost {
    background: linear-gradient(160deg, rgba(126,224,255,0.38), rgba(178,139,255,0.34));
    border: 1px solid var(--accent);
    box-shadow: 0 0 12px rgba(126,224,255,0.45);
    padding: 3px 3px 0;
  }
  .ghost i { display: block; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.55); margin-bottom: 3px; }
  .ghost i:nth-child(2) { width: 70%; opacity: .7; }
  .ghost i:nth-child(3) { width: 45%; opacity: .5; }
  .ghost-pre { border: 1px dashed rgba(126,224,255,0.8); background: rgba(126,224,255,0.08); opacity: 0; transition: opacity .1s; }
  .ghost-pre.show { opacity: 1; }
  .qk { position: absolute; z-index: 2; pointer-events: none; }
  .qk.tl { top: 0; left: 0; } .qk.tr { top: 0; right: 0; }
  .qk.bl { bottom: 0; left: 0; } .qk.br { bottom: 0; right: 0; }
  .qk.on { color: #0a0e1a; background: var(--accent); border-bottom-color: transparent; }

  /* サイズ切替（小・中・大） */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .seg button {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 7px 0 6px; border: none; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,0.06); color: var(--text);
    font-size: 14px; font-weight: 700; line-height: 1;
    transition: background .12s, transform .08s;
  }
  .seg button:hover { background: rgba(255,255,255,0.14); }
  .seg button:active { transform: scale(.96); }
  .seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0a0e1a; }
  .seg button.on kbd { background: rgba(10,14,26,0.18); color: #0a0e1a; border-bottom-color: transparent; }

  .progress {
    margin: 4px 16px 10px;
    height: 4px; border-radius: 4px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .progress > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 0 10px var(--accent);
    transition: width .35s ease;
  }

  .add { padding: 0 16px 8px; }
  .add input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 13px;
    outline: none;
    user-select: text;
    transition: all .15s;
  }
  .add input::placeholder { color: var(--muted); }
  .add input:focus {
    border-color: rgba(126,224,255,0.6);
    background: rgba(126,224,255,0.07);
    box-shadow: 0 0 0 3px rgba(126,224,255,0.12);
  }

  ul {
    flex: 1;
    list-style: none;
    overflow-y: auto;
    padding: 4px 10px 8px;
    transition: box-shadow .15s;
  }
  ul.drop-root { box-shadow: inset 0 -3px 0 var(--accent); }
  ul::-webkit-scrollbar { width: 6px; }
  ul::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 6px; }

  /* ---------- タスク行 ---------- */
  li {
    position: relative;
    margin-bottom: 3px;
    border-radius: 12px;
    transition: background .15s, opacity .2s, box-shadow .12s;
    animation: pop .22s ease;
  }
  li:hover { background: rgba(255,255,255,0.07); }
  li.sub { border-left: 2px solid rgba(126,224,255,0.28); border-radius: 0 12px 12px 0; }
  li.dragging { opacity: 0.35; }
  li.shake { animation: shake .35s; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
  @keyframes shake {
    20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
  }

  /* ドロップ位置の表示 */
  li.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
  li.drop-after  { box-shadow: inset 0 -3px 0 var(--accent); }
  li.drop-child  { background: rgba(126,224,255,0.16); box-shadow: inset 0 0 0 2px var(--accent); }
  li.drop-link   { background: rgba(255,211,110,0.14); box-shadow: inset 0 0 0 2px var(--pred); }
  /* ホバー時の関係ハイライト */
  li.rel-pred { box-shadow: inset 3px 0 0 var(--pred); background: rgba(255,211,110,0.08); }
  li.rel-succ { box-shadow: inset 3px 0 0 var(--succ); background: rgba(139,255,178,0.08); }

  .row { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 4px; }

  .grip {
    flex: none; width: 14px; text-align: center;
    color: var(--muted); opacity: .45; cursor: grab; font-size: 13px; line-height: 1;
  }
  .grip:hover { opacity: 1; color: var(--accent); }
  .grip:active { cursor: grabbing; }
  .fold {
    flex: none; width: 12px; text-align: center;
    color: var(--muted); cursor: pointer; font-size: 11px;
  }
  .fold:hover { color: var(--text); }

  .chk {
    flex: none;
    width: 18px; height: 18px;
    border-radius: 6px;
    border: 1.5px solid rgba(255,255,255,0.35);
    background: transparent;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all .15s;
  }
  .chk:hover { border-color: var(--accent); }
  li.done .chk {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
    box-shadow: 0 0 10px rgba(126,224,255,0.5);
  }
  li.done .chk::after {
    content: ""; width: 4px; height: 8px; margin-top: -2px;
    border: solid #0a0e1a; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  li.blocked .chk { border-style: dashed; border-color: rgba(255,211,110,0.7); cursor: not-allowed; }

  .lock { flex: none; display: grid; place-items: center; color: var(--pred); opacity: .9; }
  .txt {
    flex: 1; min-width: 0;
    font-size: 13px; line-height: 1.4;
    word-break: break-word;
    cursor: text;
    user-select: text;
    min-height: 1.4em;
    outline: none;
  }
  .txt[contenteditable="true"] {
    background: rgba(255,255,255,0.08); border-radius: 6px; padding: 0 4px;
    box-shadow: 0 0 0 1px rgba(126,224,255,0.5);
  }
  li.done .txt { color: var(--muted); text-decoration: line-through; }
  li.blocked:not(.done) .txt { color: rgba(234,244,255,0.62); }

  .badge {
    flex: none; font-size: 10px; padding: 1px 6px; border-radius: 8px;
    background: rgba(255,255,255,0.1); color: var(--muted); white-space: nowrap;
  }
  .badge.succ { background: rgba(139,255,178,0.14); color: var(--succ); }

  /* ホバーで出る操作ボタン */
  .acts {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: none; align-items: center; gap: 1px;
    padding: 2px 2px 2px 18px;
    background: linear-gradient(90deg, transparent, rgba(14,18,34,0.92) 28%);
    border-radius: 10px;
  }
  li:hover .acts { display: flex; }
  .act {
    border: none; background: none; color: var(--muted);
    width: 24px; height: 24px; border-radius: 7px;
    cursor: pointer; font-size: 13px; line-height: 1;
    display: grid; place-items: center; transition: all .12s;
  }
  .act:hover { color: var(--text); background: rgba(255,255,255,0.14); }
  .act.link { cursor: grab; color: var(--pred); }
  .act.link:active { cursor: grabbing; }
  .act.del:hover { color: #ff7a8a; background: rgba(255,122,138,0.18); }

  /* 先行タスクのチップ */
  .deps { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 7px 46px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    max-width: 100%; font-size: 10.5px; padding: 1px 4px 1px 7px;
    border-radius: 9px;
    background: rgba(255,211,110,0.13); color: var(--pred);
    border: 1px solid rgba(255,211,110,0.28);
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .chip.ok { background: rgba(255,255,255,0.06); color: var(--muted); border-color: rgba(255,255,255,0.12); }
  .chip.ok span { text-decoration: line-through; }
  .chip button {
    border: none; background: none; color: inherit; cursor: pointer;
    font-size: 10px; width: 16px; height: 16px; border-radius: 50%; opacity: .7;
  }
  .chip button:hover { opacity: 1; background: rgba(255,255,255,0.18); }

  .empty { text-align: center; color: var(--muted); font-size: 12px; padding: 36px 0; }

  /* ---------- フッター ---------- */
  footer { padding: 6px 16px 12px; font-size: 11px; color: var(--muted); }
  .frow { display: flex; align-items: center; gap: 10px; min-height: 26px; }
  .frow .count { flex: 1; }
  footer .clear {
    border: none; background: none; color: var(--muted);
    font-size: 11px; cursor: pointer; padding: 3px 6px; border-radius: 6px;
  }
  footer .clear:hover { color: var(--text); background: rgba(255,255,255,0.1); }
  .slider { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .slider em { font-style: normal; min-width: 30px; text-align: right; color: var(--muted); }
  input[type=range] {
    flex: 1; min-width: 40px; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.18); border-radius: 3px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent); cursor: pointer;
  }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); }
  .switch input { display: none; }
  .switch .track {
    position: relative; width: 34px; height: 18px; border-radius: 10px;
    background: rgba(255,255,255,0.18); transition: background .18s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: transform .18s;
  }
  .switch input:checked + .track { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .switch input:checked + .track::after { transform: translateX(16px); }

  .toast {
    position: absolute; left: 50%; bottom: 52px; transform: translate(-50%, 8px);
    padding: 7px 14px; border-radius: 10px; font-size: 12px; color: var(--text);
    background: rgba(10,14,28,0.92); border: 1px solid rgba(255,211,110,0.45);
    opacity: 0; pointer-events: none; transition: all .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 背景の切替(Windows 11) ---------- */
  .frow[hidden] { display: none; }
  .matseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .matseg button {
    border: none; cursor: pointer; padding: 7px 0; border-radius: 9px;
    background: rgba(255,255,255,0.07); color: var(--text); font-size: 11px;
    transition: background .12s;
  }
  .matseg button:hover { background: rgba(255,255,255,0.16); }
  .matseg button.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0a0e1a; font-weight: 700; }

  /* 外観ポップオーバー */
  .pop.wide { width: 232px; }
  .prow { display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 12px; }
  .prow[hidden] { display: none; }
  .prow .pl { flex: none; min-width: 48px; color: var(--muted); }
  .prow em { font-style: normal; min-width: 30px; text-align: right; color: var(--muted); }
  .prow .switch { margin-left: auto; }
  .prow.col { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px 0; }
  .prow.col .pl { min-width: 0; }

  /* ショートカットの競合表示 */
  .qk.ng, .seg kbd.ng { opacity: .45; text-decoration: line-through; }
  .pop-warn { margin-top: 8px; font-size: 10px; line-height: 1.45; color: var(--pred); }
  .pop-warn[hidden] { display: none; }

  /* ---------- 行アイコン(SVG) ---------- */
  .grip svg, .fold svg { display: block; margin: auto; }
  .fold { display: grid; place-items: center; }
  .fold svg { transition: transform .15s; }
  .fold.open svg { transform: rotate(90deg); }
  .act svg { display: block; }
  .chip button { display: grid; place-items: center; padding: 0; }

  /* ---------- 期限: 近づくほど赤いグラデーションが濃くなる(--u: 0〜1) ---------- */
  li { --u: 0; }
  .row, .deps { position: relative; z-index: 1; }
  li.urgent::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(90deg,
      rgba(255, 66, 90, calc(0.04 + 0.50 * var(--u))) 0%,
      rgba(255, 66, 90, calc(0.02 + 0.14 * var(--u))) 68%,
      rgba(255, 66, 90, 0) 100%);
    box-shadow: inset 3px 0 0 rgba(255, 66, 90, calc(0.15 + 0.85 * var(--u)));
  }
  .due {
    flex: none; border: none; cursor: pointer; white-space: nowrap;
    font: 600 10px/1 "Segoe UI", "Yu Gothic UI", system-ui, sans-serif;
    padding: 3px 7px; border-radius: 8px;
    background: rgba(255,255,255,0.08); color: var(--muted);
    transition: background .15s, color .15s;
  }
  .due:hover { background: rgba(255,255,255,0.16); color: var(--text); }
  li.urgent .due {
    background: rgba(255, 66, 90, calc(0.12 + 0.50 * var(--u)));
    color: #ffc9d0;
  }
  li.overdue .due { background: rgba(255, 66, 90, 0.88); color: #fff; }
  li.done .due { opacity: .45; }
  .date-in { position: absolute; right: 8px; top: 4px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* ---------- タイトルバーだけ表示(折りたたみ) ---------- */
  .ic-dn { display: none; }
  html.collapsed .ic-up { display: none; }
  html.collapsed .ic-dn { display: block; }
  html.collapsed .title .sub { display: block; }
  html.collapsed .progress, html.collapsed .add, html.collapsed ul,
  html.collapsed footer, html.collapsed .toast, html.collapsed .pop,
  html.collapsed #layoutBtn, html.collapsed #lookBtn { display: none !important; }
  html.collapsed header { height: 52px; padding: 0 12px 0 16px; }
</style>
</head>
<body>
<div class="frame">
  <div class="panel">
    <header>
      <div class="title">
        <h1>TODO <span>Light</span></h1>
        <div class="sub" id="sub"></div>
      </div>
      <button class="hbtn" id="lookBtn" title="外観（透過度・背景・最前面）">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <circle cx="7.5" cy="7.5" r="5.4" stroke="currentColor" stroke-width="1.4"/>
          <path d="M7.5 2.1a5.4 5.4 0 010 10.8z" fill="currentColor"/>
        </svg>
      </button>
      <button class="hbtn" id="layoutBtn" title="位置とサイズ">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <rect x="1.5" y="2.5" width="12" height="10" rx="2.2" stroke="currentColor" stroke-width="1.4"/>
          <rect x="8.2" y="4.6" width="3.6" height="4.6" rx="1.1" fill="currentColor"/>
        </svg>
      </button>
      <button class="hbtn" id="collapseBtn" title="タイトルバーだけにする">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path class="ic-up" d="M3.5 8.8L7 5.4l3.5 3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="ic-dn" d="M3.5 5.2L7 8.6l3.5-3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="hbtn" id="hide" title="隠す（トレイから再表示）">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 7h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="hbtn" id="quit" title="終了">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="pop wide" id="popLook" hidden>
      <div class="pop-h"><b>外観</b></div>
      <div class="prow">
        <span class="pl">透過度</span>
        <input type="range" id="tr" min="0" max="85" step="1">
        <em id="trv"></em>
      </div>
      <div class="prow col" id="matRow" hidden title="切り替えるとアプリが再起動します">
        <span class="pl">背景（切り替えると再起動）</span>
        <div class="matseg">
          <button data-m="transparent">ガラス</button>
          <button data-m="acrylic">アクリル</button>
          <button data-m="mica">マイカ</button>
        </div>
      </div>
      <div class="prow">
        <span class="pl">常に最前面</span>
        <label class="switch" title="常に最前面に表示">
          <input type="checkbox" id="top">
          <i class="track"></i>
        </label>
      </div>
    </div>

    <div class="pop" id="pop" hidden>
      <div class="pop-h"><b>配置</b><span>Ctrl + Alt + キー</span></div>
      <div class="mini-wrap">
        <div class="mini" id="mini">
          <button class="q tl" data-c="tl" aria-label="左上へ"></button>
          <button class="q tr" data-c="tr" aria-label="右上へ"></button>
          <button class="q bl" data-c="bl" aria-label="左下へ"></button>
          <button class="q br" data-c="br" aria-label="右下へ"></button>
          <div class="ghost-pre" id="ghostPre"></div>
          <div class="ghost" id="ghost"><i></i><i></i><i></i></div>
        </div>
        <kbd class="qk tl" data-k="tl"></kbd><kbd class="qk tr" data-k="tr"></kbd>
        <kbd class="qk bl" data-k="bl"></kbd><kbd class="qk br" data-k="br"></kbd>
      </div>
      <div class="seg" id="seg">
        <button data-s="s">小<kbd></kbd></button>
        <button data-s="m">中<kbd></kbd></button>
        <button data-s="l">大<kbd></kbd></button>
      </div>
      <div class="pop-warn" id="popWarn" hidden>他のアプリと競合して使えないキーがあります（「–」のキー）。</div>
    </div>

    <div class="progress"><i id="bar"></i></div>

    <div class="add">
      <input id="input" type="text" placeholder="タスクを追加して Enter" maxlength="200" autocomplete="off">
    </div>

    <ul id="list"></ul>

    <div class="toast" id="toast"></div>

    <footer>
      <div class="frow">
        <span class="count" id="count"></span>
        <button class="clear" id="clear">完了を削除</button>
      </div>
    </footer>
  </div>
</div>

<script src="logic.js"></script>
<script src="layout.js"></script>
<script>
  const L = window.TodoLogic;
  const $ = (id) => document.getElementById(id);
  let todos = [];
  let drag = null; // { id, mode: 'move' | 'link' }

  // アイコンはすべてインラインSVG(静的文字列のみ。ユーザー入力は含めない)
  const sv = (w, h, body) => `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
  const ICON = {
    grip: '<svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="3" r="1.15"/><circle cx="7" cy="3" r="1.15"/><circle cx="3" cy="7" r="1.15"/><circle cx="7" cy="7" r="1.15"/><circle cx="3" cy="11" r="1.15"/><circle cx="7" cy="11" r="1.15"/></svg>',
    chev: sv(8, 8, '<path d="M2.6 1.2L5.6 4l-3 2.8"/>'),
    lock: sv(12, 12, '<rect x="2.5" y="5.5" width="7" height="5" rx="1.4"/><path d="M4 5.5V4a2 2 0 014 0v1.5"/>'),
    plus: sv(14, 14, '<path d="M7 3.2v7.6M3.2 7h7.6"/>'),
    up: sv(14, 14, '<path d="M10.5 3.5v7"/><path d="M9 7H4M6 4.8L3.8 7 6 9.2"/>'),
    cal: sv(14, 14, '<rect x="2" y="3" width="10" height="9" rx="2"/><path d="M2 6.2h10M4.8 1.8v2.4M9.2 1.8v2.4"/>'),
    link: sv(14, 14, '<circle cx="3.6" cy="7" r="1.9"/><circle cx="10.4" cy="7" r="1.9"/><path d="M5.5 7h3"/>'),
    del: sv(14, 14, '<path d="M4 4l6 6M10 4l-6 6"/>'),
    xs: sv(8, 8, '<path d="M2 2l4 4M6 2L2 6"/>')
  };
  const icon = (cls, key, title) => {
    const b = el('button', cls);
    b.innerHTML = ICON[key];
    if (title) b.title = title;
    return b;
  };

  // 期限の見た目(赤みの強さ・ラベル)を反映する。時間経過でも呼び直す
  function dueView(li, t) {
    const lab = t.due ? L.dueLabel(t.due) : null;
    const u = t.due && !t.done ? L.urgency(t.due) : 0;
    li.style.setProperty('--u', u.toFixed(3));
    li.classList.toggle('urgent', u > 0);
    li.classList.toggle('overdue', !!(lab && lab.overdue && !t.done));
    const chip = li.querySelector('.due');
    if (chip && lab) { chip.textContent = lab.text; chip.title = '期限: ' + t.due + '（クリックで変更）'; }
  }
  function refreshDue() {
    document.querySelectorAll('#list li').forEach((li) => {
      const t = L.byId(todos, li.dataset.id);
      if (t) dueView(li, t);
    });
  }

  const save = () => window.api.saveTodos(todos);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const truncate = (s, n) => (s.length > n ? s.slice(0, n) + '…' : s);

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
  }

  const itemEl = (id) => $('list').querySelector(`li[data-id="${id}"]`);

  /* ---------- ドラッグ&ドロップ ---------- */
  function clearIndicators() {
    document.querySelectorAll('.drop-before,.drop-after,.drop-child,.drop-link')
      .forEach((n) => n.classList.remove('drop-before', 'drop-after', 'drop-child', 'drop-link'));
    $('list').classList.remove('drop-root');
  }
  function clearRel() {
    document.querySelectorAll('.rel-pred,.rel-succ')
      .forEach((n) => n.classList.remove('rel-pred', 'rel-succ'));
  }

  function startDrag(e, t, li, mode) {
    drag = { id: t.id, mode };
    clearRel();
    e.dataTransfer.effectAllowed = mode === 'link' ? 'link' : 'move';
    e.dataTransfer.setData('text/plain', t.id);
    e.dataTransfer.setDragImage(li, 24, 14);
    setTimeout(() => li.classList.add('dragging'), 0);
  }
  function endDrag() {
    drag = null;
    clearIndicators();
    document.querySelectorAll('li.dragging').forEach((n) => n.classList.remove('dragging'));
  }

  const canDrop = (t) =>
    !!drag && (drag.mode === 'link' ? L.canLink(todos, drag.id, t.id) : L.canMove(todos, drag.id, t.id));

  function zoneOf(li, e) {
    if (drag.mode === 'link') return 'link';
    const r = li.getBoundingClientRect();
    const y = (e.clientY - r.top) / r.height;
    return y < 0.28 ? 'before' : y > 0.72 ? 'after' : 'child';
  }

  function attachDrop(li, t) {
    li.addEventListener('dragover', (e) => {
      if (!canDrop(t)) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = drag.mode === 'link' ? 'link' : 'move';
      const zone = zoneOf(li, e);
      if (li.dataset.zone !== zone) {
        clearIndicators();
        li.dataset.zone = zone;
        li.classList.add('drop-' + zone);
      }
    });
    li.addEventListener('dragleave', (e) => {
      if (!li.contains(e.relatedTarget)) { clearIndicators(); delete li.dataset.zone; }
    });
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const zone = li.dataset.zone || zoneOf(li, e);
      delete li.dataset.zone;
      clearIndicators();
      if (!canDrop(t)) return;
      if (drag.mode === 'link') {
        const src = L.byId(todos, drag.id);
        L.linkTask(todos, drag.id, t.id);
        toast(`「${truncate(src.text, 12)}」が終わったら「${truncate(t.text, 12)}」に着手`);
      } else {
        todos = L.moveTask(todos, drag.id, t.id, zone);
      }
      save(); render();
    });
  }

  /* ---------- 描画 ---------- */
  function buildItem(t) {
    const depth = L.depthOf(todos, t);
    const hasKids = todos.some((x) => x.parentId === t.id);
    const blocked = L.isBlocked(todos, t);
    const succs = todos.filter((x) => x.after.includes(t.id));

    const li = el('li');
    li.dataset.id = t.id;
    if (t.done) li.classList.add('done');
    if (blocked && !t.done) li.classList.add('blocked');
    if (depth > 0) { li.classList.add('sub'); li.style.marginLeft = depth * 18 + 'px'; }

    const row = el('div', 'row');

    const grip = el('span', 'grip');
    grip.innerHTML = ICON.grip;
    grip.draggable = true;
    grip.title = 'ドラッグで移動。他タスクの中央に落とすと子タスクになります';
    grip.addEventListener('dragstart', (e) => startDrag(e, t, li, 'move'));
    grip.addEventListener('dragend', endDrag);

    const fold = el('span', 'fold' + (hasKids && !t.collapsed ? ' open' : ''));
    if (hasKids) fold.innerHTML = ICON.chev;
    if (hasKids) fold.onclick = () => { t.collapsed = !t.collapsed; save(); render(); };

    const chk = el('div', 'chk');
    chk.onclick = () => {
      const r = L.toggleDone(todos, t.id);
      if (!r.ok) {
        li.classList.add('shake');
        setTimeout(() => li.classList.remove('shake'), 400);
        toast('先行タスクが未完了です');
        return;
      }
      save(); render();
    };

    const txt = el('div', 'txt', t.text);
    txt.ondblclick = () => startEdit(txt, t);

    row.append(grip, fold, chk);
    if (blocked && !t.done) {
      const lock = el('span', 'lock');
      lock.innerHTML = ICON.lock;
      lock.title = '先行タスクが未完了のため完了できません';
      row.append(lock);
    }
    row.append(txt);

    // 期限: 日付ピッカー(透明なinput)を開くのは チップ / カレンダーボタン
    const dueIn = el('input', 'date-in');
    dueIn.type = 'date';
    dueIn.tabIndex = -1;
    dueIn.value = t.due || '';
    dueIn.onchange = () => { L.setDue(todos, t.id, dueIn.value); save(); render(); };
    const openPicker = () => { try { dueIn.showPicker(); } catch { dueIn.focus(); dueIn.click(); } };
    if (t.due) {
      const chip = el('button', 'due');
      chip.onclick = openPicker;
      row.append(chip);
    }

    if (hasKids) {
      const ds = L.descendants(todos, t.id);
      row.append(el('span', 'badge', `${ds.filter((d) => d.done).length}/${ds.length}`));
    }
    if (succs.length) {
      const b = el('span', 'badge succ', `→${succs.length}`);
      b.title = '後続: ' + succs.map((s) => s.text).join(' / ');
      row.append(b);
    }

    const acts = el('div', 'acts');
    const addKid = icon('act', 'plus', '子タスクを追加');
    addKid.onclick = () => addChild(t);
    acts.append(addKid);
    if (t.parentId) {
      const up = icon('act', 'up', '親から外す（ひとつ上の階層へ）');
      up.onclick = () => { todos = L.moveTask(todos, t.id, t.parentId, 'after'); save(); render(); };
      acts.append(up);
    }
    const cal = icon('act', 'cal', t.due ? '期限を変更・解除' : '期限を設定');
    cal.onclick = openPicker;
    const link = icon('act link', 'link');
    link.draggable = true;
    link.title = '別タスクへドラッグ＆ドロップ：このタスクが終わってから相手に着手（先行関係）';
    link.addEventListener('dragstart', (e) => startDrag(e, t, li, 'link'));
    link.addEventListener('dragend', endDrag);
    const del = icon('act del', 'del', '削除（子タスクは一つ上の階層へ）');
    del.onclick = () => { todos = L.removeTask(todos, t.id); save(); render(); };
    acts.append(cal, link, del);
    row.append(acts);
    li.append(row, dueIn);
    dueView(li, t);

    if (t.after.length) {
      const deps = el('div', 'deps');
      t.after.forEach((pid) => {
        const p = L.byId(todos, pid);
        if (!p) return;
        const chip = el('div', 'chip' + (p.done ? ' ok' : ''));
        chip.title = '先行タスク: ' + p.text;
        const label = el('span', null, '先行 ' + p.text);
        const x = icon(null, 'xs', '先行関係を解除');
        x.onclick = () => { t.after = t.after.filter((i) => i !== pid); save(); render(); };
        chip.append(label, x);
        deps.append(chip);
      });
      li.append(deps);
    }

    li.addEventListener('mouseenter', () => {
      if (drag) return;
      t.after.forEach((pid) => { const n = itemEl(pid); if (n) n.classList.add('rel-pred'); });
      succs.forEach((s) => { const n = itemEl(s.id); if (n) n.classList.add('rel-succ'); });
    });
    li.addEventListener('mouseleave', clearRel);

    attachDrop(li, t);
    return li;
  }

  function render() {
    todos = L.flatten(todos);
    const list = $('list');
    list.innerHTML = '';
    if (!todos.length) {
      list.appendChild(el('div', 'empty', 'タスクはありません'));
    }
    const hidden = (t) => {
      let c = t;
      while (c.parentId) {
        const p = L.byId(todos, c.parentId);
        if (!p) return false;
        if (p.collapsed) return true;
        c = p;
      }
      return false;
    };
    todos.filter((t) => !hidden(t)).forEach((t) => list.appendChild(buildItem(t)));

    const done = todos.filter((t) => t.done).length;
    const total = todos.length;
    $('bar').style.width = total ? (done / total) * 100 + '%' : '0%';
    $('count').textContent = total ? `${done} / ${total} 完了` : '';
    $('sub').textContent = $('count').textContent;
  }

  /* ---------- 編集・追加 ---------- */
  function startEdit(node, t) {
    node.contentEditable = 'true';
    node.focus();
    const range = document.createRange();
    range.selectNodeContents(node);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      node.contentEditable = 'false';
      const v = node.textContent.trim();
      if (v) t.text = v; else todos = L.removeTask(todos, t.id);
      save(); render();
    };
    node.onblur = finish;
    node.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); node.blur(); }
      if (e.key === 'Escape') { node.textContent = t.text; node.blur(); }
    };
  }

  function addChild(parent) {
    const c = { id: L.uid(), text: '', done: false, parentId: parent.id, after: [], collapsed: false, due: null };
    parent.collapsed = false;
    todos.push(c);
    render();
    const node = itemEl(c.id) && itemEl(c.id).querySelector('.txt');
    if (node) startEdit(node, c);
  }

  $('input').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const v = e.target.value.trim();
    if (!v) return;
    const t = { id: L.uid(), text: v, done: false, parentId: null, after: [], collapsed: false, due: null };
    todos.push(t);
    e.target.value = '';
    save(); render();
    const n = itemEl(t.id);
    if (n) n.scrollIntoView({ block: 'nearest' });
  });

  // リストの空き部分に落とすと最上位（親なし）の末尾へ移動
  const listEl = $('list');
  listEl.addEventListener('dragover', (e) => {
    if (!drag || drag.mode !== 'move' || e.target.closest('li')) return;
    e.preventDefault();
    clearIndicators();
    listEl.classList.add('drop-root');
  });
  listEl.addEventListener('dragleave', (e) => {
    if (!listEl.contains(e.relatedTarget)) listEl.classList.remove('drop-root');
  });
  listEl.addEventListener('drop', (e) => {
    if (!drag || drag.mode !== 'move' || e.target.closest('li')) return;
    e.preventDefault();
    clearIndicators();
    todos = L.moveTask(todos, drag.id, null, 'rootEnd');
    save(); render();
  });

  $('clear').onclick = () => {
    todos.filter((t) => t.done).forEach((t) => { todos = L.removeTask(todos, t.id); });
    save(); render();
  };
  $('hide').onclick = () => window.api.hide();
  $('quit').onclick = () => window.api.quit();

  /* ---------- 設定（透過度・最前面） ---------- */
  let opTimer;
  function applySettings(s) {
    document.documentElement.style.setProperty('--op', s.opacity);
    const pct = Math.round((1 - s.opacity) * 100);
    $('tr').value = pct;
    $('trv').textContent = pct + '%';
    $('top').checked = !!s.alwaysOnTop;
  }
  $('tr').addEventListener('input', (e) => {
    const pct = parseInt(e.target.value, 10);
    const op = Math.round((1 - pct / 100) * 100) / 100;
    document.documentElement.style.setProperty('--op', op);
    $('trv').textContent = pct + '%';
    clearTimeout(opTimer);
    opTimer = setTimeout(() => window.api.setOpacity(op), 200);
  });
  $('top').addEventListener('change', (e) => window.api.setPin(e.target.checked));
  window.api.onSettings(applySettings);

  /* ---------- 配置・サイズ（ミニ画面） ---------- */
  const G = window.GadgetLayout;
  let lay = null;

  // ポップオーバー(配置・外観)は同時に1つだけ開く
  const POPS = {
    layout: { el: $('pop'), btn: $('layoutBtn') },
    look: { el: $('popLook'), btn: $('lookBtn') }
  };
  let currentPop = null;
  async function setPop(name) {
    currentPop = name;
    for (const [k, p] of Object.entries(POPS)) {
      p.el.hidden = k !== name;
      p.btn.classList.toggle('on', k === name);
    }
    if (name === 'layout') renderLayout(await window.api.layoutState());
  }
  const closePop = () => setPop(null);
  function initPopovers() {
    $('layoutBtn').onclick = () => setPop(currentPop === 'layout' ? null : 'layout');
    $('lookBtn').onclick = () => setPop(currentPop === 'look' ? null : 'look');
    document.addEventListener('mousedown', (e) => {
      if (!currentPop) return;
      const p = POPS[currentPop];
      if (!p.el.contains(e.target) && !p.btn.contains(e.target)) closePop();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && currentPop) closePop(); });
  }
  const pct = (v) => (v * 100).toFixed(2) + '%';
  const rectStyle = (node, b, wa) => {
    node.style.left = pct((b.x - wa.x) / wa.width);
    node.style.top = pct((b.y - wa.y) / wa.height);
    node.style.width = pct(b.width / wa.width);
    node.style.height = pct(b.height / wa.height);
  };

  function renderLayout(s) {
    lay = s;
    $('mini').style.aspectRatio = `${s.workArea.width} / ${s.workArea.height}`;
    rectStyle($('ghost'), s.bounds, s.workArea);
    document.querySelectorAll('.qk').forEach((k) => k.classList.toggle('on', k.dataset.k === s.corner));
    document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', b.dataset.s === s.size));
  }

  // sc: メインプロセスが実際に割り当てたキー(競合時は代替キー・未割当は null)
  function initLayoutUi(sc) {
    const mark = (node, id) => {
      node.textContent = G.shortcutLabel(sc[id]);
      node.classList.toggle('ng', !sc[id]);
    };
    $('popWarn').hidden = G.SHORTCUT_IDS.every((id) => sc[id]);
    document.querySelectorAll('.qk').forEach((k) => mark(k, k.dataset.k));
    document.querySelectorAll('#seg button').forEach((b) => {
      mark(b.querySelector('kbd'), b.dataset.s);
      b.onclick = () => { window.api.sizePreset(b.dataset.s); closePop(); };
    });
    document.querySelectorAll('.q').forEach((q) => {
      const c = q.dataset.c;
      q.onclick = () => { window.api.snap(c); closePop(); };
      // ホバーで「ここに移動します」の点線プレビュー
      q.onmouseenter = () => {
        if (!lay) return;
        rectStyle($('ghostPre'), G.cornerBounds(lay.workArea, c, lay.bounds), lay.workArea);
        $('ghostPre').classList.add('show');
      };
      q.onmouseleave = () => $('ghostPre').classList.remove('show');
    });

    window.api.onLayout(renderLayout);
  }

  // 背景素材の切替(Windows 11のみ)。変更するとアプリが再起動する
  function initMaterial(env) {
    if (!env.win11) return;
    $('matRow').hidden = false;
    document.querySelectorAll('#matRow button').forEach((b) => {
      b.classList.toggle('on', b.dataset.m === env.material);
      b.onclick = () => { if (b.dataset.m !== env.material) window.api.setMaterial(b.dataset.m); };
    });
  }

  // タイトルバーだけ表示(アプリは常駐のまま)。状態の正本はメインプロセス
  function applyCollapsed(on) {
    document.documentElement.classList.toggle('collapsed', !!on);
    $('collapseBtn').title = on ? '元の大きさに戻す' : 'タイトルバーだけにする';
    if (on) closePop();
  }
  $('collapseBtn').onclick = () => window.api.toggleCollapse();
  window.api.onCollapsed(applyCollapsed);

  (async () => {
    const data = await window.api.load();
    todos = L.normalize(data.todos);
    document.documentElement.classList.toggle('native', !!(data.env && data.env.nativeBlur));
    applySettings(data.settings);
    initPopovers();
    initLayoutUi((data.env && data.env.shortcuts) || {});
    initMaterial(data.env || {});
    setInterval(refreshDue, 60 * 1000);
    render();
  })();
</script>
</body>
