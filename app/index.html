<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Todo Gadget</title>
<style>
  :root {
    --op: 0.82;
    --accent: #7ee0ff;
    --accent2: #b28bff;
    --pred: #ffd36e;
    --succ: #8bffb2;
    --text: #eaf4ff;
    --muted: rgba(234, 244, 255, 0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: transparent;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    overflow: hidden;
  }
  .frame { height: 100%; padding: 10px; }
  .panel {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(126, 224, 255, 0.16), transparent 55%),
      radial-gradient(100% 80% at 100% 100%, rgba(178, 139, 255, 0.18), transparent 60%),
      linear-gradient(160deg, rgba(22, 28, 46, calc(var(--op) * 0.92)), rgba(10, 12, 24, var(--op)));
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.18),
      inset 0 0 40px rgba(126, 224, 255, 0.04);
    overflow: hidden;
  }

  /* Windows 11 ネイティブすりガラス: ウィンドウ自体がぼける。CSSは薄い色味だけ重ねる */
  html.native .frame { padding: 0; }
  html.native .panel {
    border-radius: 0;
    border: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(126, 224, 255, 0.10), transparent 55%),
      radial-gradient(100% 80% at 100% 100%, rgba(178, 139, 255, 0.12), transparent 60%),
      linear-gradient(160deg, rgba(22, 28, 46, calc(var(--op) * 0.45)), rgba(10, 12, 24, calc(var(--op) * 0.55)));
  }

  header {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 16px 8px;
  }
  .title { flex: 1; }
  .title h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.12em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .hbtn {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px;
    border: none; border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: all .15s;
  }
  .hbtn:hover { background: rgba(255,255,255,0.16); color: var(--text); }

  .progress {
    margin: 4px 16px 10px;
    height: 4px; border-radius: 4px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .progress > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 0 10px var(--accent);
    transition: width .35s ease;
  }

  .add { padding: 0 16px 8px; }
  .add input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 13px;
    outline: none;
    user-select: text;
    transition: all .15s;
  }
  .add input::placeholder { color: var(--muted); }
  .add input:focus {
    border-color: rgba(126,224,255,0.6);
    background: rgba(126,224,255,0.07);
    box-shadow: 0 0 0 3px rgba(126,224,255,0.12);
  }

  ul {
    flex: 1;
    list-style: none;
    overflow-y: auto;
    padding: 4px 10px 8px;
    transition: box-shadow .15s;
  }
  ul.drop-root { box-shadow: inset 0 -3px 0 var(--accent); }
  ul::-webkit-scrollbar { width: 6px; }
  ul::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 6px; }

  /* ---------- タスク行 ---------- */
  li {
    position: relative;
    margin-bottom: 3px;
    border-radius: 12px;
    transition: background .15s, opacity .2s, box-shadow .12s;
    animation: pop .22s ease;
  }
  li:hover { background: rgba(255,255,255,0.07); }
  li.sub { border-left: 2px solid rgba(126,224,255,0.28); border-radius: 0 12px 12px 0; }
  li.dragging { opacity: 0.35; }
  li.shake { animation: shake .35s; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
  @keyframes shake {
    20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
  }

  /* ドロップ位置の表示 */
  li.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
  li.drop-after  { box-shadow: inset 0 -3px 0 var(--accent); }
  li.drop-child  { background: rgba(126,224,255,0.16); box-shadow: inset 0 0 0 2px var(--accent); }
  li.drop-link   { background: rgba(255,211,110,0.14); box-shadow: inset 0 0 0 2px var(--pred); }
  /* ホバー時の関係ハイライト */
  li.rel-pred { box-shadow: inset 3px 0 0 var(--pred); background: rgba(255,211,110,0.08); }
  li.rel-succ { box-shadow: inset 3px 0 0 var(--succ); background: rgba(139,255,178,0.08); }

  .row { display: flex; align-items: center; gap: 6px; padding: 7px 8px 7px 4px; }

  .grip {
    flex: none; width: 14px; text-align: center;
    color: var(--muted); opacity: .45; cursor: grab; font-size: 13px; line-height: 1;
  }
  .grip:hover { opacity: 1; color: var(--accent); }
  .grip:active { cursor: grabbing; }
  .fold {
    flex: none; width: 12px; text-align: center;
    color: var(--muted); cursor: pointer; font-size: 11px;
  }
  .fold:hover { color: var(--text); }

  .chk {
    flex: none;
    width: 18px; height: 18px;
    border-radius: 6px;
    border: 1.5px solid rgba(255,255,255,0.35);
    background: transparent;
    cursor: pointer;
    display: grid; place-items: center;
    transition: all .15s;
  }
  .chk:hover { border-color: var(--accent); }
  li.done .chk {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-color: transparent;
    box-shadow: 0 0 10px rgba(126,224,255,0.5);
  }
  li.done .chk::after { content: "✓"; color: #0a0e1a; font-size: 12px; font-weight: 800; }
  li.blocked .chk { border-style: dashed; border-color: rgba(255,211,110,0.7); cursor: not-allowed; }

  .lock { flex: none; font-size: 11px; opacity: .85; }
  .txt {
    flex: 1; min-width: 0;
    font-size: 13px; line-height: 1.4;
    word-break: break-word;
    cursor: text;
    user-select: text;
    min-height: 1.4em;
    outline: none;
  }
  .txt[contenteditable="true"] {
    background: rgba(255,255,255,0.08); border-radius: 6px; padding: 0 4px;
    box-shadow: 0 0 0 1px rgba(126,224,255,0.5);
  }
  li.done .txt { color: var(--muted); text-decoration: line-through; }
  li.blocked:not(.done) .txt { color: rgba(234,244,255,0.62); }

  .badge {
    flex: none; font-size: 10px; padding: 1px 6px; border-radius: 8px;
    background: rgba(255,255,255,0.1); color: var(--muted); white-space: nowrap;
  }
  .badge.succ { background: rgba(139,255,178,0.14); color: var(--succ); }

  /* ホバーで出る操作ボタン */
  .acts {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    display: none; align-items: center; gap: 1px;
    padding: 2px 2px 2px 18px;
    background: linear-gradient(90deg, transparent, rgba(14,18,34,0.92) 28%);
    border-radius: 10px;
  }
  li:hover .acts { display: flex; }
  .act {
    border: none; background: none; color: var(--muted);
    width: 24px; height: 24px; border-radius: 7px;
    cursor: pointer; font-size: 13px; line-height: 1;
    display: grid; place-items: center; transition: all .12s;
  }
  .act:hover { color: var(--text); background: rgba(255,255,255,0.14); }
  .act.link { cursor: grab; color: var(--pred); }
  .act.link:active { cursor: grabbing; }
  .act.del:hover { color: #ff7a8a; background: rgba(255,122,138,0.18); }

  /* 先行タスクのチップ */
  .deps { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 7px 46px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    max-width: 100%; font-size: 10.5px; padding: 1px 4px 1px 7px;
    border-radius: 9px;
    background: rgba(255,211,110,0.13); color: var(--pred);
    border: 1px solid rgba(255,211,110,0.28);
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .chip.ok { background: rgba(255,255,255,0.06); color: var(--muted); border-color: rgba(255,255,255,0.12); }
  .chip.ok span { text-decoration: line-through; }
  .chip button {
    border: none; background: none; color: inherit; cursor: pointer;
    font-size: 10px; width: 16px; height: 16px; border-radius: 50%; opacity: .7;
  }
  .chip button:hover { opacity: 1; background: rgba(255,255,255,0.18); }

  .empty { text-align: center; color: var(--muted); font-size: 12px; padding: 36px 0; }

  /* ---------- フッター ---------- */
  footer { padding: 6px 16px 12px; font-size: 11px; color: var(--muted); }
  .frow { display: flex; align-items: center; gap: 10px; min-height: 26px; }
  .frow .count { flex: 1; }
  footer .clear {
    border: none; background: none; color: var(--muted);
    font-size: 11px; cursor: pointer; padding: 3px 6px; border-radius: 6px;
  }
  footer .clear:hover { color: var(--text); background: rgba(255,255,255,0.1); }
  .slider { flex: 1; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .slider em { font-style: normal; min-width: 30px; text-align: right; color: var(--muted); }
  input[type=range] {
    flex: 1; min-width: 40px; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.18); border-radius: 3px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--accent); cursor: pointer;
  }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); }
  .switch input { display: none; }
  .switch .track {
    position: relative; width: 34px; height: 18px; border-radius: 10px;
    background: rgba(255,255,255,0.18); transition: background .18s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: transform .18s;
  }
  .switch input:checked + .track { background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .hint { margin-top: 4px; font-size: 10px; opacity: .8; line-height: 1.5; }

  .toast {
    position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 8px);
    padding: 7px 14px; border-radius: 10px; font-size: 12px; color: var(--text);
    background: rgba(10,14,28,0.92); border: 1px solid rgba(255,211,110,0.45);
    opacity: 0; pointer-events: none; transition: all .2s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="frame">
  <div class="panel">
    <header>
      <div class="title">
        <h1>TODO</h1>
        <div class="sub" id="date"></div>
      </div>
      <button class="hbtn" id="hide" title="隠す（トレイから再表示）">–</button>
      <button class="hbtn" id="quit" title="終了">✕</button>
    </header>

    <div class="progress"><i id="bar"></i></div>

    <div class="add">
      <input id="input" type="text" placeholder="タスクを追加して Enter" maxlength="200" autocomplete="off">
    </div>

    <ul id="list"></ul>

    <div class="toast" id="toast"></div>

    <footer>
      <div class="frow">
        <span class="count" id="count"></span>
        <button class="clear" id="clear">完了を削除</button>
      </div>
      <div class="frow">
        <label class="slider">透過度
          <input type="range" id="tr" min="0" max="85" step="1">
          <em id="trv"></em>
        </label>
        <label class="switch" title="常に最前面に表示">
          <span>最前面</span>
          <input type="checkbox" id="top">
          <i class="track"></i>
        </label>
      </div>
      <div class="hint">⠿ ドラッグ：並べ替え／他タスクの中へ入れて親子に ・ ⛓ ドラッグ：別タスクへ落として先行関係</div>
    </footer>
  </div>
</div>

<script src="logic.js"></script>
<script>
  const L = window.TodoLogic;
  const $ = (id) => document.getElementById(id);
  let todos = [];
  let drag = null; // { id, mode: 'move' | 'link' }

  const save = () => window.api.saveTodos(todos);
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const truncate = (s, n) => (s.length > n ? s.slice(0, n) + '…' : s);

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
  }

  const itemEl = (id) => $('list').querySelector(`li[data-id="${id}"]`);

  /* ---------- ドラッグ&ドロップ ---------- */
  function clearIndicators() {
    document.querySelectorAll('.drop-before,.drop-after,.drop-child,.drop-link')
      .forEach((n) => n.classList.remove('drop-before', 'drop-after', 'drop-child', 'drop-link'));
    $('list').classList.remove('drop-root');
  }
  function clearRel() {
    document.querySelectorAll('.rel-pred,.rel-succ')
      .forEach((n) => n.classList.remove('rel-pred', 'rel-succ'));
  }

  function startDrag(e, t, li, mode) {
    drag = { id: t.id, mode };
    clearRel();
    e.dataTransfer.effectAllowed = mode === 'link' ? 'link' : 'move';
    e.dataTransfer.setData('text/plain', t.id);
    e.dataTransfer.setDragImage(li, 24, 14);
    setTimeout(() => li.classList.add('dragging'), 0);
  }
  function endDrag() {
    drag = null;
    clearIndicators();
    document.querySelectorAll('li.dragging').forEach((n) => n.classList.remove('dragging'));
  }

  const canDrop = (t) =>
    !!drag && (drag.mode === 'link' ? L.canLink(todos, drag.id, t.id) : L.canMove(todos, drag.id, t.id));

  function zoneOf(li, e) {
    if (drag.mode === 'link') return 'link';
    const r = li.getBoundingClientRect();
    const y = (e.clientY - r.top) / r.height;
    return y < 0.28 ? 'before' : y > 0.72 ? 'after' : 'child';
  }

  function attachDrop(li, t) {
    li.addEventListener('dragover', (e) => {
      if (!canDrop(t)) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = drag.mode === 'link' ? 'link' : 'move';
      const zone = zoneOf(li, e);
      if (li.dataset.zone !== zone) {
        clearIndicators();
        li.dataset.zone = zone;
        li.classList.add('drop-' + zone);
      }
    });
    li.addEventListener('dragleave', (e) => {
      if (!li.contains(e.relatedTarget)) { clearIndicators(); delete li.dataset.zone; }
    });
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const zone = li.dataset.zone || zoneOf(li, e);
      delete li.dataset.zone;
      clearIndicators();
      if (!canDrop(t)) return;
      if (drag.mode === 'link') {
        const src = L.byId(todos, drag.id);
        L.linkTask(todos, drag.id, t.id);
        toast(`「${truncate(src.text, 12)}」が終わったら「${truncate(t.text, 12)}」に着手`);
      } else {
        todos = L.moveTask(todos, drag.id, t.id, zone);
      }
      save(); render();
    });
  }

  /* ---------- 描画 ---------- */
  function buildItem(t) {
    const depth = L.depthOf(todos, t);
    const hasKids = todos.some((x) => x.parentId === t.id);
    const blocked = L.isBlocked(todos, t);
    const succs = todos.filter((x) => x.after.includes(t.id));

    const li = el('li');
    li.dataset.id = t.id;
    if (t.done) li.classList.add('done');
    if (blocked && !t.done) li.classList.add('blocked');
    if (depth > 0) { li.classList.add('sub'); li.style.marginLeft = depth * 18 + 'px'; }

    const row = el('div', 'row');

    const grip = el('span', 'grip', '⠿');
    grip.draggable = true;
    grip.title = 'ドラッグで移動。他タスクの中央に落とすと子タスクになります';
    grip.addEventListener('dragstart', (e) => startDrag(e, t, li, 'move'));
    grip.addEventListener('dragend', endDrag);

    const fold = el('span', 'fold', hasKids ? (t.collapsed ? '▸' : '▾') : '');
    if (hasKids) fold.onclick = () => { t.collapsed = !t.collapsed; save(); render(); };

    const chk = el('div', 'chk');
    chk.onclick = () => {
      const r = L.toggleDone(todos, t.id);
      if (!r.ok) {
        li.classList.add('shake');
        setTimeout(() => li.classList.remove('shake'), 400);
        toast('先行タスクが未完了です');
        return;
      }
      save(); render();
    };

    const txt = el('div', 'txt', t.text);
    txt.ondblclick = () => startEdit(txt, t);

    row.append(grip, fold, chk);
    if (blocked && !t.done) row.append(el('span', 'lock', '🔒'));
    row.append(txt);

    if (hasKids) {
      const ds = L.descendants(todos, t.id);
      row.append(el('span', 'badge', `${ds.filter((d) => d.done).length}/${ds.length}`));
    }
    if (succs.length) {
      const b = el('span', 'badge succ', `→${succs.length}`);
      b.title = '後続: ' + succs.map((s) => s.text).join(' / ');
      row.append(b);
    }

    const acts = el('div', 'acts');
    const addKid = el('button', 'act', '＋');
    addKid.title = '子タスクを追加';
    addKid.onclick = () => addChild(t);
    acts.append(addKid);
    if (t.parentId) {
      const up = el('button', 'act', '⇤');
      up.title = '親から外す（ひとつ上の階層へ）';
      up.onclick = () => { todos = L.moveTask(todos, t.id, t.parentId, 'after'); save(); render(); };
      acts.append(up);
    }
    const link = el('button', 'act link', '⛓');
    link.draggable = true;
    link.title = '別タスクへドラッグ＆ドロップ：このタスクが終わってから相手に着手（先行関係）';
    link.addEventListener('dragstart', (e) => startDrag(e, t, li, 'link'));
    link.addEventListener('dragend', endDrag);
    const del = el('button', 'act del', '✕');
    del.title = '削除（子タスクは一つ上の階層へ）';
    del.onclick = () => { todos = L.removeTask(todos, t.id); save(); render(); };
    acts.append(link, del);
    row.append(acts);
    li.append(row);

    if (t.after.length) {
      const deps = el('div', 'deps');
      t.after.forEach((pid) => {
        const p = L.byId(todos, pid);
        if (!p) return;
        const chip = el('div', 'chip' + (p.done ? ' ok' : ''));
        chip.title = '先行タスク: ' + p.text;
        const label = el('span', null, '⛓ ' + p.text);
        const x = el('button', null, '✕');
        x.title = '先行関係を解除';
        x.onclick = () => { t.after = t.after.filter((i) => i !== pid); save(); render(); };
        chip.append(label, x);
        deps.append(chip);
      });
      li.append(deps);
    }

    li.addEventListener('mouseenter', () => {
      if (drag) return;
      t.after.forEach((pid) => { const n = itemEl(pid); if (n) n.classList.add('rel-pred'); });
      succs.forEach((s) => { const n = itemEl(s.id); if (n) n.classList.add('rel-succ'); });
    });
    li.addEventListener('mouseleave', clearRel);

    attachDrop(li, t);
    return li;
  }

  function render() {
    todos = L.flatten(todos);
    const list = $('list');
    list.innerHTML = '';
    if (!todos.length) {
      list.appendChild(el('div', 'empty', 'タスクはありません ✨'));
    }
    const hidden = (t) => {
      let c = t;
      while (c.parentId) {
        const p = L.byId(todos, c.parentId);
        if (!p) return false;
        if (p.collapsed) return true;
        c = p;
      }
      return false;
    };
    todos.filter((t) => !hidden(t)).forEach((t) => list.appendChild(buildItem(t)));

    const done = todos.filter((t) => t.done).length;
    const total = todos.length;
    $('bar').style.width = total ? (done / total) * 100 + '%' : '0%';
    $('count').textContent = total ? `${done} / ${total} 完了` : '';
  }

  /* ---------- 編集・追加 ---------- */
  function startEdit(node, t) {
    node.contentEditable = 'true';
    node.focus();
    const range = document.createRange();
    range.selectNodeContents(node);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      node.contentEditable = 'false';
      const v = node.textContent.trim();
      if (v) t.text = v; else todos = L.removeTask(todos, t.id);
      save(); render();
    };
    node.onblur = finish;
    node.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); node.blur(); }
      if (e.key === 'Escape') { node.textContent = t.text; node.blur(); }
    };
  }

  function addChild(parent) {
    const c = { id: L.uid(), text: '', done: false, parentId: parent.id, after: [], collapsed: false };
    parent.collapsed = false;
    todos.push(c);
    render();
    const node = itemEl(c.id) && itemEl(c.id).querySelector('.txt');
    if (node) startEdit(node, c);
  }

  $('input').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const v = e.target.value.trim();
    if (!v) return;
    const t = { id: L.uid(), text: v, done: false, parentId: null, after: [], collapsed: false };
    todos.push(t);
    e.target.value = '';
    save(); render();
    const n = itemEl(t.id);
    if (n) n.scrollIntoView({ block: 'nearest' });
  });

  // リストの空き部分に落とすと最上位（親なし）の末尾へ移動
  const listEl = $('list');
  listEl.addEventListener('dragover', (e) => {
    if (!drag || drag.mode !== 'move' || e.target.closest('li')) return;
    e.preventDefault();
    clearIndicators();
    listEl.classList.add('drop-root');
  });
  listEl.addEventListener('dragleave', (e) => {
    if (!listEl.contains(e.relatedTarget)) listEl.classList.remove('drop-root');
  });
  listEl.addEventListener('drop', (e) => {
    if (!drag || drag.mode !== 'move' || e.target.closest('li')) return;
    e.preventDefault();
    clearIndicators();
    todos = L.moveTask(todos, drag.id, null, 'rootEnd');
    save(); render();
  });

  $('clear').onclick = () => {
    todos.filter((t) => t.done).forEach((t) => { todos = L.removeTask(todos, t.id); });
    save(); render();
  };
  $('hide').onclick = () => window.api.hide();
  $('quit').onclick = () => window.api.quit();

  /* ---------- 設定（透過度・最前面） ---------- */
  let opTimer;
  function applySettings(s) {
    document.documentElement.style.setProperty('--op', s.opacity);
    const pct = Math.round((1 - s.opacity) * 100);
    $('tr').value = pct;
    $('trv').textContent = pct + '%';
    $('top').checked = !!s.alwaysOnTop;
  }
  $('tr').addEventListener('input', (e) => {
    const pct = parseInt(e.target.value, 10);
    const op = Math.round((1 - pct / 100) * 100) / 100;
    document.documentElement.style.setProperty('--op', op);
    $('trv').textContent = pct + '%';
    clearTimeout(opTimer);
    opTimer = setTimeout(() => window.api.setOpacity(op), 200);
  });
  $('top').addEventListener('change', (e) => window.api.setPin(e.target.checked));
  window.api.onSettings(applySettings);

  function updateDate() {
    const d = new Date();
    const w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    $('date').textContent = `${d.getMonth() + 1}月${d.getDate()}日 (${w})`;
  }

  (async () => {
    const data = await window.api.load();
    todos = L.normalize(data.todos);
    document.documentElement.classList.toggle('native', !!(data.env && data.env.nativeBlur));
    applySettings(data.settings);
    updateDate();
    setInterval(updateDate, 60 * 1000);
    render();
  })();
</script>
</body>
</html>
